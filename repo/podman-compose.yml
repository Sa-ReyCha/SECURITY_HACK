# ─────────────────────────────────────────────────────────────────────────────
# SAP SOC Log Ingestion API — podman-compose.yml
#
# Adaptado para Podman desde docker-compose.yml
# Cambios principales:
#   - Usa 'podman' en lugar de 'docker' 
#   - Compatible con podman-compose (sintaxis compatible con docker-compose)
#   - Usa redes de Podman
#
# Services:
#   api        — FastAPI app (built from fast_app/Dockerfile)
#   cloudflared — Cloudflare Tunnel (exposes :8000 to the internet)
#
# Usage:
#   1. podman-compose -f podman-compose.yml up --build
#   OR si no tienes podman-compose instalado:
#   podman compose -f podman-compose.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI application ─────────────────────────────────────────────────────
  api:
    build:
      context: ./fast_app
      dockerfile: Dockerfile
    container_name: soc_api
    restart: unless-stopped
    ports:
      - "8000:8000"        # also reachable on localhost:8000 for local testing
    volumes:
      # Persistent data — keeps logs.csv and access_logs.csv on the host Mac.
      # Bind mount: repo/output/ on the host ↔ /app/output/ in the container.
      # Files survive container stop/rm/recreate and are directly readable on disk.
      - ./output:/app/output
      # api_keys.json — edit on host, picked up on next restart
      - ./fast_app/api_keys.json:/app/api_keys.json:ro
      # .env — override any config without rebuilding
      - ./fast_app/.env:/app/.env:ro
    environment:
      # These can also live in fast_app/.env; here as Podman-level overrides
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Cloudflare Tunnel ───────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tunnel
    restart: unless-stopped
    # No depende del estado "healthy" del API porque podman-compose, al usar
    # docker-compose externamente, puede marcar falsos negativos. El túnel
    # se iniciará y seguirá reintentando hasta que el backend responda.
    command: tunnel --no-autoupdate run --url http://api:8000
    environment:
      # Paste your tunnel token here or in .env (see DEPLOY.md)
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - default

networks:
  default:
    driver: bridge