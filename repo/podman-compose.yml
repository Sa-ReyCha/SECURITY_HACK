# ─────────────────────────────────────────────────────────────────────────────
# SAP SOC Log Ingestion API — podman-compose.yml
#
# Adaptado para Podman desde docker-compose.yml
# Cambios principales:
#   - Usa 'podman' en lugar de 'docker' 
#   - Compatible con podman-compose (sintaxis compatible con docker-compose)
#   - Usa redes de Podman
#
# Services:
#   api        — FastAPI app (built from fast_app/Dockerfile)
#   cloudflared — Cloudflare Tunnel (exposes :8000 to the internet)
#
# Usage:
#   1. podman-compose -f podman-compose.yml up --build
#   OR si no tienes podman-compose instalado:
#   podman compose -f podman-compose.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI application ─────────────────────────────────────────────────────
  api:
    build:
      context: ./fast_app
      dockerfile: Dockerfile
    container_name: soc_api
    restart: unless-stopped
    ports:
      - "8000:8000"        # also reachable on localhost:8000 for local testing
    volumes:
      # Named volume — Podman manages storage; use scripts/extract-logs.sh to pull files out.
      # logs.csv is pre-loaded into the volume; access_logs.csv is written here at runtime.
      - soc_api_output:/app/output
      # api_keys.json — edit on host, picked up on next restart
      - ./fast_app/api_keys.json:/app/api_keys.json:ro
      # .env — override any config without rebuilding
      - ./fast_app/.env:/app/.env:ro
    environment:
      # These can also live in fast_app/.env; here as Podman-level overrides
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=4); c.request('GET','/health'); r=c.getresponse(); exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Cloudflare Tunnel (primary) ─────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tunnel
    restart: unless-stopped
    # No depende del estado "healthy" del API porque podman-compose, al usar
    # docker-compose externamente, puede marcar falsos negativos. El túnel
    # se iniciará y seguirá reintentando hasta que el backend responda.
    command: tunnel --no-autoupdate run --url http://api:8000
    environment:
      # Paste your tunnel token here or in .env (see DEPLOY.md)
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - default

  # ── Cloudflare Tunnel (secondary) ───────────────────────────────────────────
  cloudflared2:
    image: cloudflare/cloudflared:latest
    container_name: tunnel2
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://api:8000
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN_2}
    networks:
      - default

  # ── Cloudflare Tunnel (3) ────────────────────────────────────────────────────
  cloudflared3:
    image: cloudflare/cloudflared:latest
    container_name: tunnel3
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://api:8000
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN_3}
    networks:
      - default

  # ── Cloudflare Tunnel (4) ────────────────────────────────────────────────────
  cloudflared4:
    image: cloudflare/cloudflared:latest
    container_name: tunnel4
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://api:8000
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN_4}
    networks:
      - default

  # ── Cloudflare Tunnel (5) ────────────────────────────────────────────────────
  cloudflared5:
    image: cloudflare/cloudflared:latest
    container_name: tunnel5
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://api:8000
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN_5}
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  soc_api_output:
    external: true   # created with: podman volume create soc_api_output
